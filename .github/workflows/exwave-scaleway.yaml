name: Exwave Scaleway image
on:
  push:
    tags: ["v*-exwave.*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exwave-scaleway-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - name: Select immutable release tag
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="commit-${GITHUB_SHA}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: rg.fr-par.scw.cloud/exwave-admin/openmeter:${{ steps.release.outputs.tag }}
          build-args: VERSION=${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "rg.fr-par.scw.cloud/exwave-admin/openmeter:${IMAGE_TAG}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
